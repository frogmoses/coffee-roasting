[project]
name = "roast-analyzer"
version = "0.1.0"
description = "Coffee roast analysis tool for Hottop KN-8828B-2K+ with Artisan"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "anthropic",
]

[project.optional-dependencies]
# Roaster-side ear (ear/): microphone capture + numpy detector. On the dev
# machine `uv sync --extra ear` lets the detector tests run.
ear = [
    "numpy",
    "sounddevice",
    "websockets>=16",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
